<form class="calc" id="sim" onsubmit="return false">
  <label>Chance of winning, % <input id="p" type="number" min="1" max="99" step="1" value="55" inputmode="decimal" autocomplete="off"></label>
  <label>Win per ₹1 staked, ₹ <input id="b" type="number" min="0.1" max="20" step="0.1" value="1" inputmode="decimal" autocomplete="off"></label>
  <label>Bet size, × Kelly <input id="m" type="number" min="0" max="4" step="0.05" value="1" inputmode="decimal" autocomplete="off"></label>
  <label>Number of bets <select id="n">
    <option value="100">100</option><option value="250">250</option><option value="1000" selected>1,000</option>
  </select></label>
</form>
<p class="note" id="sim-note" aria-live="polite"></p>
<div class="table-scroll"><table class="data">
  <thead><tr><th scope="col">Bet size</th><th scope="col">Fraction of wealth</th><th scope="col">Growth per bet</th><th scope="col">Typical ₹1 becomes</th><th scope="col">Average ₹1 becomes</th><th scope="col">Halved at some point</th><th scope="col">Behind at the end</th></tr></thead>
  <tbody id="sim-out"></tbody>
</table></div>
<h3 id="paths-title">Your bet size: ₹1 over the bets</h3>
<div id="sim-paths" class="sim-chart" role="img" aria-label="Wealth paths for the chosen bet size"></div>
<h3>Growth per bet against bet size</h3>
<div id="sim-growth" class="sim-chart" role="img" aria-label="Growth per bet against bet size"></div>
<script>
$js
(() => {
  const PATHS = 2000, css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const el = (id) => document.getElementById(id);
  const note = el("sim-note"), out = el("sim-out");
  const num = (x, d) => x.toLocaleString("en-IN", { maximumFractionDigits: d });
  const money = (x) => !Number.isFinite(x) ? "–" : x >= 1e11 ? "₹" + x.toExponential(1).replace("e+", " × 10^")
    : x >= 1e7 ? `₹${num(x / 1e7, 1)} crore` : x >= 1e5 ? `₹${num(x / 1e5, 1)} lakh`
    : "₹" + num(x, x < 10 ? 2 : 0);
  const pct = (x) => (x * 100).toFixed(x > 0 && x < 0.01 ? 1 : 0) + "%";
  const base = () => ({
    paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: getComputedStyle(document.body).fontFamily, color: css("--text-2"), size: 13 },
    margin: { l: 56, r: 16, t: 32, b: 48 }, showlegend: true,
    legend: { orientation: "h", y: 1.02, yanchor: "bottom", x: 0 },
  });
  const axis = (title, extra = {}) => Object.assign({ title, gridcolor: css("--grid"), zeroline: false }, extra);
  const update = () => {
    const p = parseFloat(el("p").value) / 100, b = parseFloat(el("b").value), m = parseFloat(el("m").value);
    const n = parseInt(el("n").value, 10);
    if (!(p > 0 && p < 1 && b > 0 && m >= 0)) { out.innerHTML = ""; Plotly.purge("sim-paths"); Plotly.purge("sim-growth"); note.textContent = "Enter a chance between 1% and 99%, a win above ₹0 and a bet size of 0 or more."; return; }
    const fk = kellyFraction(p, b);
    if (fk <= 0) {
      out.innerHTML = ""; Plotly.purge("sim-paths"); Plotly.purge("sim-growth");
      note.textContent = `No edge: at ${pct(p)} to win ₹${b} per ₹1, every bet loses money on average. Kelly says bet nothing.`;
      return;
    }
    const f = Math.min(m * fk, 0.999);
    note.textContent = `Kelly's bet: ${pct(fk)} of your money each time (edge ${pct(p * b - (1 - p))} per ₹1 ÷ odds ${b}). ` +
      `${PATHS.toLocaleString("en-IN")} simulated players, each starting with ₹1.`;
    const rows = [0.5, 1, 2].includes(m) ? [0.5, 1, 2] : [0.5, 1, 2, m].sort((a, c) => a - c);
    let chosen;
    out.innerHTML = rows.map((k) => {
      const logw = simulate(Math.min(k * fk, 0.999), p, b, n, PATHS, 1), s = summarise(logw);
      if (k === m) chosen = logw;
      return `<tr${k === m ? ' class="pick"' : ""}><th scope="row">${k}× Kelly${k === m ? " (yours)" : ""}</th><td>${pct(Math.min(k * fk, 0.999))}</td>` +
        `<td>${(growthRate(Math.min(k * fk, 0.999), p, b) * 100).toFixed(2)}%</td><td>${money(s.typical)}</td><td>${money(s.mean)}</td>` +
        `<td>${pct(s.halved)}</td><td>${pct(s.behind)}</td></tr>`;
    }).join("");
    el("paths-title").textContent = `${m}× Kelly: ₹1 over ${n.toLocaleString("en-IN")} bets`;
    const step = Math.max(1, Math.round(n / 200)), xs = [], lo = [], hi = [], mid = [];
    for (let t = 0; t <= n; t += step) {
      const col = chosen.map((path) => path[t]).sort((a, c) => a - c);
      xs.push(t); lo.push(Math.exp(quantile(col, 0.1))); hi.push(Math.exp(quantile(col, 0.9)));
      mid.push(Math.exp(col.reduce((a, c) => a + c, 0) / col.length));
    }
    const accent = css("--accent"), muted = css("--muted");
    const samples = chosen.slice(0, 12).map((path, i) => ({
      x: xs, y: xs.map((t) => Math.exp(path[t])), mode: "lines", line: { color: muted, width: 1 },
      opacity: 0.6, hoverinfo: "skip", showlegend: i === 0, name: "single players",
    }));
    Plotly.react("sim-paths", [
      { x: xs, y: hi, mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false },
      { x: xs, y: lo, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: accent + "26", name: "middle 80%", hovertemplate: "bet %{x}: 10th percentile ₹%{y:.2f}<extra></extra>" },
      ...samples,
      { x: xs, y: mid, mode: "lines", line: { color: accent, width: 2.5 }, name: "typical player", hovertemplate: "bet %{x}: typical ₹%{y:.2f}<extra></extra>" },
    ], Object.assign(base(), {
      xaxis: axis("bets"), yaxis: axis("wealth from ₹1 (log scale)", { type: "log" }), hovermode: "x" }),
    { displaylogo: false, responsive: true });
    const gx = [], gy = [];
    for (let k = 0; k <= 3.001; k += 0.02) { const ff = Math.min(k * fk, 0.999); gx.push(+k.toFixed(2)); gy.push(growthRate(ff, p, b) * 100); }
    const gm = growthRate(f, p, b) * 100, top = growthRate(fk, p, b) * 100;
    Plotly.react("sim-growth", [
      { x: gx, y: gy, mode: "lines", line: { color: accent, width: 2 }, name: "growth per bet", hovertemplate: "%{x}× Kelly: %{y:.3f}% per bet<extra></extra>" },
      { x: [m], y: [gm], mode: "markers", marker: { color: css("--text"), size: 10 }, name: "your bet size", hovertemplate: "%{x}× Kelly: %{y:.3f}% per bet<extra></extra>" },
    ], Object.assign(base(), {
      xaxis: axis("bet size, × Kelly"), yaxis: axis("growth per bet, %", { range: [-top * 2.5, top * 1.4] }), hovermode: "closest" }),
    { displaylogo: false, responsive: true });
  };
  const form = el("sim");
  form.addEventListener("input", update);
  form.addEventListener("change", update);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
  update();
})();
</script>
